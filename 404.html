<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f7f2ea" />
  <title>Page not found | Driving Samaritans</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!--
    GitHub Pages serves this for any path with no file behind it. Every real
    route now has its own page (scripts/prerender-routes.js), so this no longer
    has to bounce visitors into the app: it only ever means "not found", and
    says so in the site's own voice instead of a redirect flicker.
    Same palette and type as auth-action.html; both are standalone pages
    outside the React build, so they load their fonts directly.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f7f2ea;
      --clay: #efe5d8;
      --charcoal: #24312f;
      --slate: #5f6f69;
      --coral: #b87963;
      --coral-dark: #a5644e;
      --font-serif: 'Instrument Serif', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--cream); }
    body {
      font-family: var(--font-sans);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
      overflow-x: hidden;
    }
    .glow {
      position: fixed;
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--clay) 0%, rgba(247, 242, 234, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      z-index: -1;
      pointer-events: none;
    }
    .mark {
      width: 112px;
      height: 112px;
      margin-bottom: 28px;
      opacity: 0.92;
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 14px;
    }
    h1 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(36px, 7vw, 56px);
      line-height: 1.08;
      letter-spacing: -0.01em;
      max-width: 14ch;
      margin-bottom: 18px;
    }
    h1 em { font-style: italic; color: var(--coral); }
    p {
      font-size: 17px;
      line-height: 1.6;
      color: var(--slate);
      max-width: 36ch;
      margin-bottom: 34px;
    }
    a.button {
      display: inline-block;
      padding: 15px 30px;
      border-radius: 999px;
      background: var(--coral);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }
    a.button:hover { background: var(--coral-dark); transform: translateY(-1px); }
    a.button:focus-visible { outline: 2px solid var(--charcoal); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      a.button { transition: none; }
      a.button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <img class="mark" src="/splash-logo.png" alt="Driving Samaritans" />
  <div class="eyebrow">Page not found</div>
  <h1>This road doesn&rsquo;t <em>lead anywhere</em>.</h1>
  <p>The page you were looking for has moved or never existed. Let&rsquo;s get you back somewhere useful.</p>
  <a class="button" href="/">Back to the homepage</a>
</body>
</html>
